name: validate-artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify compressed artifact integrity
        run: |
          for archive in *.tar.gz; do
            [[ -e "$archive" ]] || continue
            tar -tzf "$archive" >/dev/null
            echo "Validated $archive"
          done
          for archive in *.zip; do
            [[ -e "$archive" ]] || continue
            unzip -t "$archive"
          done
      - name: Compile Python learning tool
        run: python -m py_compile tensorrt_llm_interactive_code_lab.py
